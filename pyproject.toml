[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llplot"
version = "0.1.0"
description = "A journal-ready matplotlib house style: SciencePlots base, colour-blind-safe palette, size-budgeted savefig"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Leonard Lebrun"}]
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.setuptools]
packages = ["llplot"]

[tool.setuptools.package-data]
llplot = ["styles/*.mplstyle", "styles/LICENSE-SciencePlots"]
